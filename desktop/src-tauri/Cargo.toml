[package]
name = "bilinote-desktop"
version = "0.1.0"
description = "BiliNote PC 客户端：本地视频 AI 笔记工作站"
authors = ["BiliNote"]
edition = "2021"

[lib]
name = "bilinote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
if-addrs = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
